notes:
  - 本指南由中华中医药学会发布，非国家卫健委食养指南系列，为中医"治未病"专项指南。
  - 本Skill不含地区性食谱数据，以体质辨证调理和药膳为主要食养手段。
  - 中药方剂和外治法（耳穴/推拿/针刺）须由专业中医师操作，不可自行模仿。
  - 适用范围为18周岁以下单纯性肥胖人群。
